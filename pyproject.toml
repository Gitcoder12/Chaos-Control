[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chaos-control"
version = "0.2.1"
description = "Streaming data collection and deterministic dataset curation tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Dharavath Satvik"}]
dependencies = []

[project.optional-dependencies]
http = ["httpx>=0.27"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
chaos-control = "chaos_control:main"

[tool.setuptools]
py-modules = ["Collector", "pipeline", "chaos_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["Collector", "pipeline", "chaos_control"]
