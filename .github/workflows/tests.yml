name: Chaos-Control Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint source and tests
        run: ruff check Collector.py pipeline.py chaos_control.py tests
      - name: Compile source and tests
        run: python -m compileall -q Collector.py pipeline.py chaos_control.py tests
      - name: Run the complete test suite
        run: pytest -q --timeout=30
      - name: Verify installed command
        run: chaos-control --help
