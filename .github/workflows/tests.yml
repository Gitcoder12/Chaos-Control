name: Chaos-Control Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile collector and tests
        run: python -m compileall -q Collector.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
